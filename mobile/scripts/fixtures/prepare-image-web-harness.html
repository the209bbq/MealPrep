<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>prepare-image-web harness</title>
  </head>
  <body>
    <script type="module">
      import { preparePantryImageFromFile } from './prepare-image-web-bundle.js';

      window.runPrepareTest = async (file) => {
        try {
          const prepared = await preparePantryImageFromFile(file);
          const preview = await createImageBitmap(await (await fetch(prepared.uri)).blob());
          const out = {
            ok: true,
            mimeType: prepared.mimeType,
            byteLength: prepared.byteLength,
            base64: prepared.base64,
            qualityWarnings: prepared.qualityWarnings ?? [],
            bitmapWidth: preview.width,
            bitmapHeight: preview.height,
          };
          preview.close?.();
          URL.revokeObjectURL(prepared.uri);
          return out;
        } catch (error) {
          return {
            ok: false,
            errorName: error?.name ?? 'Error',
            errorMessage: error?.message ?? String(error),
          };
        }
      };
    </script>
  </body>
</html>
