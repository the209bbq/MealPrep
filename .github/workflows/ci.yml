name: CI checks

# Runs on every PR and push so broken code is caught before the Pages deploy.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Advisory for now: existing lint errors must not block typecheck and tests.
      # Remove continue-on-error once the lint errors are fixed.
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Tests
        run: npm test

  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static site tests
        run: |
          node lab.test.js
          node shopping.test.js
