name: Mobile checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-checks.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Python deps (stores ingest checks)
        run: pip3 install -r mobile/scripts/stores-ingest/requirements.txt
      - name: Typecheck and test
        working-directory: mobile
        env:
          TZ: UTC
        run: |
          npm ci
          npm run typecheck
          npm test
